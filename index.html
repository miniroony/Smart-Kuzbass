<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Смарт Кузбасс</title>
  
  <!-- Telegram WebApp API -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <!-- Leaflet для карты -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Шапка приложения -->
  <header class="app-header">
    <img src="logo.jpg" alt="Смарт Кузбасс" class="logo">
    <div class="header-text">
      <h1>Смарт Кузбасс</h1>
      <p>Благоустройство малых городов</p>
    </div>
  </header>

  <!-- Основной контент (вкладки) -->
  <main class="app-content">
    
    <!-- Вкладка: Карта -->
    <section id="tab-map" class="tab-content active">
      <div class="tab-header">
        <h2>Карта обращений</h2>
        <button id="btn-locate" class="btn-icon" title="Моё местоположение">📍</button>
      </div>
      <div id="map" class="map-container"></div>
      <div class="map-info">
        <p id="location-status">Определение местоположения...</p>
      </div>
    </section>

    <!-- Вкладка: Добавить обращение -->
    <section id="tab-add" class="tab-content">
      <div class="tab-header">
        <h2>Новое обращение</h2>
      </div>
      
      <form id="appeal-form" class="appeal-form">
        <div class="form-group">
          <label for="appeal-category">Категория</label>
          <select id="appeal-category" required>
            <option value="">Выберите категорию</option>
            <option value="roads">Дороги и тротуары</option>
            <option value="lighting">Освещение</option>
            <option value="cleaning">Уборка и чистота</option>
            <option value="playgrounds">Детские площадки</option>
            <option value="utilities">Коммунальные услуги</option>
            <option value="other">Другое</option>
          </select>
        </div>

        <div class="form-group">
          <label for="appeal-title">Краткое описание</label>
          <input type="text" id="appeal-title" placeholder="Например: Яма на дороге" maxlength="80" required>
        </div>

        <div class="form-group">
          <label for="appeal-description">Подробности</label>
          <textarea id="appeal-description" rows="4" placeholder="Опишите проблему подробнее..." required></textarea>
        </div>

        <div class="form-group">
          <label for="appeal-photo">Фото (необязательно)</label>
          <input type="file" id="appeal-photo" accept="image/*" capture="environment">
          <div id="photo-preview" class="photo-preview hidden"></div>
        </div>

        <div class="form-group location-group">
          <label>Местоположение</label>
          <p id="form-location" class="location-text">Определяется автоматически...</p>
          <button type="button" id="btn-refresh-location" class="btn-secondary">Обновить</button>
        </div>

        <button type="submit" class="btn-primary">Отправить обращение</button>
      </form>

      <div id="form-success" class="success-message hidden">
        ✅ Обращение отправлено! Мы уже работаем над ним.
      </div>
    </section>

    <!-- Вкладка: Лента -->
    <section id="tab-feed" class="tab-content">
      <div class="tab-header">
        <h2>Лента обращений</h2>
        <select id="feed-filter" class="filter-select">
          <option value="all">Все</option>
          <option value="new">Новые</option>
          <option value="in_progress">В работе</option>
          <option value="done">Решено</option>
        </select>
      </div>
      
      <div id="appeals-list" class="appeals-list">
        <!-- Обращения будут добавлены через JavaScript -->
      </div>
    </section>

    <!-- Вкладка: Профиль -->
    <section id="tab-profile" class="tab-content">
      <div class="tab-header">
        <h2>Мой профиль</h2>
      </div>

      <div class="profile-card">
        <div class="avatar-wrapper">
          <img id="profile-avatar" src="https://via.placeholder.com/100" alt="Аватар" class="avatar">
          <button id="btn-change-avatar" class="btn-avatar">📷</button>
        </div>
        
        <div class="profile-info">
          <div class="form-group">
            <label for="profile-name">Имя</label>
            <input type="text" id="profile-name" placeholder="Ваше имя">
          </div>
          
          <div class="form-group">
            <label for="profile-phone">Телефон</label>
            <input type="tel" id="profile-phone" placeholder="+7 (999) 123-45-67">
          </div>
          
          <div class="form-group">
            <label for="profile-city">Город</label>
            <input type="text" id="profile-city" placeholder="Например: Кемерово" value="Кемерово">
          </div>
        </div>

        <button id="btn-save-profile" class="btn-primary">Сохранить профиль</button>
      </div>

      <div class="profile-stats">
        <div class="stat">
          <span class="stat-number" id="stat-appeals">0</span>
          <span class="stat-label">Моих обращений</span>
        </div>
        <div class="stat">
          <span class="stat-number" id="stat-resolved">0</span>
          <span class="stat-label">Решено</span>
        </div>
      </div>

      <div class="profile-actions">
        <button id="btn-clear-data" class="btn-danger">Очистить все данные</button>
      </div>
    </section>
  </main>

  <!-- Нижняя навигация (вкладки) -->
  <nav class="bottom-nav">
    <button class="nav-item active" data-tab="map">
      <span class="nav-icon">🗺️</span>
      <span class="nav-label">Карта</span>
    </button>
    <button class="nav-item" data-tab="add">
      <span class="nav-icon">➕</span>
      <span class="nav-label">Добавить</span>
    </button>
    <button class="nav-item" data-tab="feed">
      <span class="nav-icon">📋</span>
      <span class="nav-label">Лента</span>
    </button>
    <button class="nav-item" data-tab="profile">
      <span class="nav-icon">👤</span>
      <span class="nav-label">Профиль</span>
    </button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
